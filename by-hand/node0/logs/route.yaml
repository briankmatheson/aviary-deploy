# Loki's HTTP API on node0's shared gateway, under the registry's name: every
# Loki path begins /loki/ and the registry only uses /v2/, so no second
# hostname (and no DNS record or certificate for one) is needed.
#   https://registry.mesh.<domain>/loki/api/v1/push   (user logs, password in
#   Secret loki/loki-push-credentials)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: loki, namespace: loki}
spec:
  parentRefs: [{name: internal, namespace: gateway-system, sectionName: registry}]
  hostnames: [registry.mesh.bmath.nyc]
  rules:
  - matches: [{path: {type: PathPrefix, value: /loki/}}]
    backendRefs: [{name: loki-gateway, port: 80}]
