---
apiVersion: v1
kind: Service
metadata:
  name: axigen-mail-wm-direct
  namespace: aviary-axigen
spec:
  ports:
  - appProtocol: http
    name: wm
    port: 443
    protocol: TCP
    targetPort: 443
  selector:
    app: axigen-mail-be
  type: ClusterIP
---
apiVersion: v1
data:
  openid-configuration: "{\n  \"issuer\": \"https://gitea.aviary.mesh.bmath.nyc\"\
    ,\n  \"authorization_endpoint\": \"https://gitea.aviary.mesh.bmath.nyc/login/oauth/authorize\"\
    ,\n  \"token_endpoint\": \"http://gitea-http.aviary-gitea.svc.cluster.local:3000/login/oauth/access_token\"\
    ,\n  \"jwks_uri\": \"http://gitea-http.aviary-gitea.svc.cluster.local:3000/login/oauth/keys\"\
    ,\n  \"userinfo_endpoint\": \"http://gitea-http.aviary-gitea.svc.cluster.local:3000/login/oauth/userinfo\"\
    ,\n  \"introspection_endpoint\": \"http://gitea-http.aviary-gitea.svc.cluster.local:3000/login/oauth/introspect\"\
    ,\n  \"response_types_supported\": [\n    \"code\",\n    \"id_token\"\n  ],\n\
    \  \"id_token_signing_alg_values_supported\": [\n    \"RS256\"\n  ],\n  \"subject_types_supported\"\
    : [\n    \"public\"\n  ],\n  \"scopes_supported\": [\n    \"openid\",\n    \"\
    profile\",\n    \"email\",\n    \"groups\"\n  ],\n  \"claims_supported\": [\n\
    \    \"aud\",\n    \"exp\",\n    \"iat\",\n    \"iss\",\n    \"sub\",\n    \"\
    name\",\n    \"preferred_username\",\n    \"profile\",\n    \"picture\",\n   \
    \ \"website\",\n    \"locale\",\n    \"updated_at\",\n    \"email\",\n    \"email_verified\"\
    ,\n    \"groups\"\n  ],\n  \"grant_types_supported\": [\n    \"authorization_code\"\
    ,\n    \"refresh_token\"\n  ]\n}\n"
kind: ConfigMap
metadata:
  name: gitea-oidc-discovery
  namespace: aviary-axigen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gitea-oidc-discovery
  name: gitea-oidc-discovery
  namespace: aviary-axigen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-oidc-discovery
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gitea-oidc-discovery
    spec:
      containers:
      - image: nginxinc/nginx-unprivileged:1.27-alpine
        imagePullPolicy: IfNotPresent
        name: nginx
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /.well-known/openid-configuration
            port: 8080
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /usr/share/nginx/html/.well-known
          name: doc
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: gitea-oidc-discovery
        name: doc
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-oidc-discovery
  namespace: aviary-axigen
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: gitea-oidc-discovery
  type: ClusterIP
