---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: aviary-gitea
spec:
  hostnames:
  - gitea.aviary.mesh.bmath.nyc
  - gitea.xdebbie.org
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: aviary
    namespace: envoy-gateway
    sectionName: https-gitea
  rules:
  - filters:
    - requestRedirect:
        hostname: aviary.mesh.bmath.nyc
        path:
          replaceFullPath: /favicon.ico
          type: ReplaceFullPath
        scheme: https
        statusCode: 302
      type: RequestRedirect
    matches:
    - path:
        type: Exact
        value: /assets/img/favicon.svg
    - path:
        type: Exact
        value: /assets/img/favicon.png
    - path:
        type: Exact
        value: /favicon.ico
  - backendRefs:
    - group: ''
      kind: Service
      name: gitea-http
      port: 3000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
