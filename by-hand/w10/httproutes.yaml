apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    aviary/group: system
  name: kubeshark
  namespace: aviary-kubeshark
spec:
  hostnames:
  - kubeshark.aviary.mesh.bmath.nyc
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: aviary
    namespace: envoy-gateway
    sectionName: https-kubeshark
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: kubeshark-front
      port: 80
      weight: 1
    filters:
    - requestHeaderModifier:
        remove:
        - X-Aviary-Id-Token
      type: RequestHeaderModifier
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    aviary/group: apps
  name: cloudbeaver
  namespace: aviary-cloudbeaver
spec:
  hostnames:
  - cloudbeaver.aviary.mesh.bmath.nyc
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: aviary
    namespace: envoy-gateway
    sectionName: https-cloudbeaver
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: cloudbeaver
      port: 8978
      weight: 1
    filters:
    - requestHeaderModifier:
        remove:
        - X-Aviary-Id-Token
        - X-Role
        set:
        - name: X-Team
          value: user
      type: RequestHeaderModifier
    matches:
    - path:
        type: PathPrefix
        value: /
