---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gitea-login-cloudbeaver
  namespace: aviary-cloudbeaver
spec:
  jwt:
    providers:
    - audiences:
      - e4685731-9b81-4988-9fba-9e5c92c39aa5
      claimToHeaders:
      - claim: preferred_username
        header: X-User
      extractFrom:
        headers:
        - name: X-Aviary-Id-Token
      issuer: https://gitea.aviary.mesh.bmath.nyc
      name: gitea
      remoteJWKS:
        cacheDuration: 300s
        uri: http://gitea-http.aviary-gitea.svc.cluster.local:3000/login/oauth/keys
  oidc:
    clientID: e4685731-9b81-4988-9fba-9e5c92c39aa5
    clientSecret:
      group: ''
      kind: Secret
      name: aviary-gateway-oidc
    forwardIDToken:
      header: X-Aviary-Id-Token
    logoutPath: /oauth2/logout
    provider:
      authorizationEndpoint: https://gitea.aviary.mesh.bmath.nyc/login/oauth/authorize
      backendRefs:
      - group: ''
        kind: Service
        name: gitea-http
        namespace: aviary-gitea
        port: 3000
        weight: 1
      issuer: https://gitea.aviary.mesh.bmath.nyc
      tokenEndpoint: https://gitea.aviary.mesh.bmath.nyc/login/oauth/access_token
    refreshToken: false
    scopes:
    - openid
    - profile
    - email
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: cloudbeaver
